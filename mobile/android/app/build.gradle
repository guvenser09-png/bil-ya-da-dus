plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Yukleme anahtari (Play upload keystore): android/key.properties varsa
// release imzasi ondan okunur; yoksa DEBUG imzasina duser (yerel/emulator
// derlemeleri calissin diye). key.properties + keystore REPODA TUTULMAZ.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "com.bilyadadus.app"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // Google Play kalıcı kimliği — İLK yüklemeden sonra ASLA değişemez.
        applicationId "com.bilyadadus.app"
        minSdkVersion flutter.minSdkVersion
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // key.properties varsa gercek yukleme imzasi; yoksa debug (yerel).
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:32.7.0")
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.android.gms:play-services-ads:22.6.0"
    implementation "androidx.multidex:multidex:2.0.1"
}

// google-services.json varsa Firebase (FCM) plugin'ini uygula. Dosya yokken
// build KIRILMASIN: push init Dart tarafinda zaten korumali (Firebase yoksa
// sessizce atlanir). Firebase konsolundan Android uygulamasi eklenince
// app/google-services.json koy — plugin otomatik devreye girer.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}
