<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1024px;height:500px;font-family:-apple-system,'SF Pro Display',Helvetica,Arial,sans-serif;
 background:radial-gradient(120% 140% at 20% 0%,#1c2450 0%,#0e1230 55%,#090b20 100%);
 color:#fff;display:flex;align-items:center;padding:0 64px;position:relative;overflow:hidden}
.glow{position:absolute;width:620px;height:620px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,170,40,.20) 0%,transparent 65%);top:-180px;right:-140px}
.left{flex:1;z-index:2}
.badge{display:inline-block;background:rgba(255,193,7,.15);border:2px solid rgba(255,193,7,.6);
 color:#ffc107;font-size:17px;font-weight:800;letter-spacing:3px;padding:9px 22px;border-radius:999px;margin-bottom:20px}
h1{font-size:62px;font-weight:900;line-height:1.05;letter-spacing:-1px}
h1 span{color:#ffc107}
.sub{margin-top:18px;font-size:26px;font-weight:700;color:rgba(255,255,255,.92)}
.sub b{color:#ff5252}
.tags{margin-top:22px;display:flex;gap:12px}
.tag{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;
 padding:8px 18px;font-size:16px;font-weight:700;color:rgba(255,255,255,.8)}
.right{width:300px;display:flex;align-items:center;justify-content:center;z-index:2}
.icon{width:230px;height:230px;border-radius:56px;background:linear-gradient(135deg,#ffd54f,#ff8f00);
 display:flex;align-items:center;justify-content:center;font-size:132px;font-weight:900;color:#12132b;
 box-shadow:0 26px 70px rgba(255,150,20,.42)}
</style></head><body>
<div class="glow"></div>
<div class="left">
 <div class="badge">CANLI · 12 KİŞİLİK</div>
 <h1>BİL YA DA <span>DÜŞ</span></h1>
 <div class="sub">Yanlış bilen <b>KAPAKTAN DÜŞER</b> 🔥</div>
 <div class="tags"><div class="tag">🧠 Genel kültür</div><div class="tag">⚡ 90 saniye</div><div class="tag">🏆 Şampiyon ol</div></div>
</div>
<div class="right"><div class="icon">B</div></div>
</body></html>
